<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roof70s WhatsApp 共存連接</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    button { background: #1877f2; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    pre { background: #111; color: #9f9; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 80px; }
    .warn { background: #fff6e5; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Roof70s WhatsApp 共存</h1>
  <p class="warn">請用 <b>呢個 App 嘅管理員 Facebook</b> 登入。只接受共存，見到遷移就取消。</p>
  <button type="button" id="go">連接 WhatsApp 共存模式</button>
  <h3>結果</h3>
  <pre id="out">等 SDK…</pre>
  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '28239445439061491',
        autoLogAppEvents: true,
        xfbml: true,
        version: 'v22.0'
      });
      document.getElementById('out').textContent = 'SDK 就緒。請點按鈕。';
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  <script>
    const CONFIG_ID = '1625827739172183';
    const out = document.getElementById('out');
    function log(x) {
      out.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
    }
    window.addEventListener('message', (event) => {
      const origin = String(event.origin || '');
      if (!origin.includes('facebook.com') && !origin.includes('instagram.com')) return;
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'WA_EMBEDDED_SIGNUP') log(data);
      } catch (e) {}
    });
    document.getElementById('go').onclick = function () {
      if (!window.FB) { log('等 SDK 載完再試'); return; }
      const opts = {
        config_id: CONFIG_ID,
        response_type: 'code',
        override_default_response_type: true,
        extras: {
          version: 'v3',
          sessionInfoVersion: '3',
          featureType: 'whatsapp_business_app_onboarding',
          setup: {}
        }
      };
      log('開啟中… ' + JSON.stringify(opts));
      FB.login(function (response) { log(response || { error: 'empty' }); }, opts);
    };
  </script>
</body>
</html>
